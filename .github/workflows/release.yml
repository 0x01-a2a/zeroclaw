name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: linux-x64

      # Explicit feature set — phone-smart included (default), channel-zerox1 enabled.
      - name: Build
        run: cargo build --release --locked --features channel-zerox1,phone-smart

      - name: Rename binary
        run: cp target/release/zeroclaw zeroclaw-linux-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: zeroclaw-linux-x64
          generate_release_notes: false

  build-android:
    name: Build Android ARM64
    # Sequence after linux to avoid concurrent release upload race.
    needs: build-linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: android-arm64

      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VERSION="${ANDROID_NDK_VERSION:-r26d}"
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          curl -fsSL "https://dl.google.com/android/repository/${NDK_ZIP}" -o "/tmp/${NDK_ZIP}"
          unzip -q "/tmp/${NDK_ZIP}" -d "${RUNNER_TEMP}"
          rm -f "/tmp/${NDK_ZIP}"
          NDK_HOME="${RUNNER_TEMP}/android-ndk-${NDK_VERSION}"
          TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=${NDK_HOME}"                                                              >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/aarch64-linux-android21-clang"     >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android21-clang"                      >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android21-clang++"                   >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${TOOLCHAIN}/llvm-ar"                                             >> "$GITHUB_ENV"

      # Full build: phone-smart aggregator tools enabled (ships to users).
      - name: Build (full — with phone-smart)
        run: cargo build --release --locked --features channel-zerox1,phone-smart --target aarch64-linux-android

      - name: Rename binary (full)
        run: cp target/aarch64-linux-android/release/zeroclaw zeroclaw-android-arm64

      # Debug build: phone-smart disabled — raw bridge tools only, no regex/heuristic overhead.
      - name: Build (no-smart — bridge tools only)
        run: cargo build --release --locked --no-default-features --features channel-zerox1 --target aarch64-linux-android

      - name: Rename binary (no-smart)
        run: cp target/aarch64-linux-android/release/zeroclaw zeroclaw-android-arm64-no-smart

      # Sanity check: both artifacts must exist and the full build must be larger
      # (it contains extra code for the smart aggregator tools).
      - name: Validate artifacts
        run: |
          set -euo pipefail
          test -f zeroclaw-android-arm64         || (echo "ERROR: full binary missing" && exit 1)
          test -f zeroclaw-android-arm64-no-smart || (echo "ERROR: no-smart binary missing" && exit 1)
          FULL=$(stat -c%s zeroclaw-android-arm64)
          SLIM=$(stat -c%s zeroclaw-android-arm64-no-smart)
          echo "Full binary:     ${FULL} bytes"
          echo "No-smart binary: ${SLIM} bytes"
          test "$FULL" -gt "$SLIM" || (echo "ERROR: full binary should be larger than no-smart binary" && exit 1)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zeroclaw-android-arm64
            zeroclaw-android-arm64-no-smart
          generate_release_notes: false

  build-ios:
    name: Build iOS ARM64 static library
    # Sequence after android to avoid concurrent release upload race.
    needs: build-android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ios-arm64

      # Build zeroclaw as a static library with the ios-ffi feature so that
      # zeroclaw_start / zeroclaw_stop C symbols are emitted for in-process
      # linking by the iOS app (exec*() is blocked by the iOS kernel sandbox).
      - name: Build zeroclaw static library (iOS ARM64)
        run: cargo build --release --locked --features ios-ffi,channel-zerox1,phone-smart --target aarch64-apple-ios
        env:
          CARGO_TERM_COLOR: always

      - name: Rename artifact
        run: cp target/aarch64-apple-ios/release/libzeroclaw.a libzeroclaw-ios-arm64.a

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: libzeroclaw-ios-arm64.a
          generate_release_notes: false
