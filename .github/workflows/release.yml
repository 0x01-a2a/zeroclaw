name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: linux-x64

      - name: Build
        run: cargo build --release --locked --features channel-zerox1,phone-smart

      - uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-linux-x64
          path: target/release/zeroclaw
          if-no-files-found: error

  build-android:
    name: Build Android ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: android-arm64

      # Use the NDK pre-installed on the runner — no download needed.
      - name: Set up Android NDK linker
        run: |
          set -euo pipefail
          TOOLCHAIN="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android21-clang"                  >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android21-clang++"               >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${TOOLCHAIN}/llvm-ar"                                         >> "$GITHUB_ENV"

      # Full build: phone-smart aggregator tools enabled.
      - name: Build (full — with phone-smart)
        run: cargo build --release --locked --features channel-zerox1,phone-smart --target aarch64-linux-android

      # Copy full binary before the no-smart build overwrites the output path.
      - name: Stage full binary
        run: cp target/aarch64-linux-android/release/zeroclaw zeroclaw-android-arm64

      # Slim build: raw bridge tools only, no regex/heuristic overhead.
      - name: Build (no-smart — bridge tools only)
        run: cargo build --release --locked --no-default-features --features channel-zerox1 --target aarch64-linux-android

      - name: Stage and validate artifacts
        run: |
          set -euo pipefail
          cp target/aarch64-linux-android/release/zeroclaw zeroclaw-android-arm64-no-smart
          FULL=$(stat -c%s zeroclaw-android-arm64)
          SLIM=$(stat -c%s zeroclaw-android-arm64-no-smart)
          echo "Full binary:     ${FULL} bytes"
          echo "No-smart binary: ${SLIM} bytes"
          test "$FULL" -gt "$SLIM" || (echo "ERROR: full binary should be larger than no-smart" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-android-arm64
          path: zeroclaw-android-arm64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-android-arm64-no-smart
          path: zeroclaw-android-arm64-no-smart
          if-no-files-found: error

  # iOS simulator static library — built in CI so the team always has a known-good
  # build against a pinned Xcode/SDK version. Not included in GitHub Releases;
  # available as a workflow artifact for 90 days.
  #
  # Device library (aarch64-apple-ios) is still built locally and embedded
  # directly in Xcode — run:
  #   IPHONEOS_DEPLOYMENT_TARGET=15.1 cargo build --release --locked --lib \
  #     --features ios-ffi,channel-zerox1,phone-smart \
  #     --target aarch64-apple-ios
  build-ios-sim:
    name: Build iOS Simulator lib (aarch64-apple-ios-sim)
    runs-on: macos-14   # Xcode 15.4 — matches project deployment target iOS 15.1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ios-sim

      # Print versions so any future SDK/deployment-target mismatch is immediately
      # visible in the logs rather than surfacing as a cryptic linker error.
      - name: Show Xcode and iOS Simulator SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      # IPHONEOS_DEPLOYMENT_TARGET must match the Xcode project (15.1).
      # Without this, Rust's LLVM defaults to a lower version and the linker
      # rejects the .a when Xcode tries to embed it with a higher minimum.
      - name: Build iOS Simulator static library
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.1"
        run: |
          cargo build --release --locked --lib \
            --features ios-ffi,channel-zerox1,phone-smart \
            --target aarch64-apple-ios-sim

      - name: Rename artifact
        run: cp target/aarch64-apple-ios-sim/release/libzeroclaw.a libzeroclaw-ios-sim.a

      - uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-ios-sim
          path: libzeroclaw-ios-sim.a
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [build-linux-x64, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          cp artifacts/zeroclaw-linux-x64/zeroclaw             zeroclaw-linux-x64
          cp artifacts/zeroclaw-android-arm64/zeroclaw-android-arm64             zeroclaw-android-arm64
          cp artifacts/zeroclaw-android-arm64-no-smart/zeroclaw-android-arm64-no-smart zeroclaw-android-arm64-no-smart

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zeroclaw-linux-x64
            zeroclaw-android-arm64
            zeroclaw-android-arm64-no-smart
          generate_release_notes: false
